version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types must match the minimum supported Node.js version (engines.node).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Blocked until typescript-eslint supports the next TypeScript major.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
